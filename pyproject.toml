[project]
name = "przetargi"
version = "1.0.0"
description = "Daily monitor of flat and house sale notices in Gdańsk, Sopot and nearby towns"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "jinja2>=3.1",
    "deweloperuch-mcp>=0.1.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/przetargi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
